name: Reproduce setup-java toolchains bug (#1099)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  reproduce-toolchains-overwrite:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Install JDK 11
      - name: Setup Java 11
        # uses: actions/setup-java@v5
        uses: actions/setup-java@brunoborges-fix-toolchain-overwrite-issue-1099
        with:
          distribution: 'temurin'
          java-version: '11'
          overwrite-settings: false

      - name: Show toolchains after JDK 11
        run: |
          echo "=== toolchains.xml after JDK 11 setup ==="
          cat ~/.m2/toolchains.xml
          echo ""
          echo "Expected: 1 toolchain entry (temurin_11)"
          grep -c '<toolchain>' ~/.m2/toolchains.xml || true

      # Step 2: Install JDK 17
      - name: Setup Java 17
        # uses: actions/setup-java@v5
        uses: actions/setup-java@brunoborges-fix-toolchain-overwrite-issue-1099
        with:
          distribution: 'temurin'
          java-version: '17'
          overwrite-settings: false

      - name: Show toolchains after JDK 17
        run: |
          echo "=== toolchains.xml after JDK 17 setup ==="
          cat ~/.m2/toolchains.xml
          echo ""
          echo "Expected: 2 toolchain entries (temurin_11 + temurin_17)"
          echo "Actual count:"
          grep -c '<toolchain>' ~/.m2/toolchains.xml || true

      # Step 3: Install JDK 21
      - name: Setup Java 21
        # uses: actions/setup-java@v5
        uses: actions/setup-java@brunoborges-fix-toolchain-overwrite-issue-1099
        with:
          distribution: 'temurin'
          java-version: '21'
          overwrite-settings: false

      - name: Show toolchains after JDK 21
        run: |
          echo "=== toolchains.xml after JDK 21 setup ==="
          cat ~/.m2/toolchains.xml
          echo ""
          echo "Expected: 3 toolchain entries (temurin_11 + temurin_17 + temurin_21)"
          echo "Actual count:"
          grep -c '<toolchain>' ~/.m2/toolchains.xml || true

      # Final validation
      - name: Validate result
        run: |
          COUNT=$(grep -c '<toolchain>' ~/.m2/toolchains.xml)
          echo "Total toolchain entries: $COUNT"
          if [ "$COUNT" -ne 3 ]; then
            echo "::error::BUG CONFIRMED - Expected 3 toolchain entries but found $COUNT"
            echo ""
            echo "This reproduces https://github.com/actions/setup-java/issues/1099"
            echo "Previous entries were overwritten instead of preserved."
            exit 1
          else
            echo "All 3 entries present - bug is NOT present in this version."
          fi
