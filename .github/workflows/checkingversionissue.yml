name: Test Java 26 from SDKMAN

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create SDKMAN version file
        shell: bash
        run: |
          echo "java=26-tem" > .sdkmanrc

      - name: Set up Java 26
        id: setup-java
        uses: actions/setup-java@fb4abd7a7075173ac733c41f723ac0c47c41ad17
        with:
          java-version-file: .sdkmanrc
          cache: gradle

      - name: Verify Java installation
        shell: bash
        run: |
          java --version
          javac --version
          test "$(java -version 2>&1 | sed -n 's/.*version "\(26[^"]*\)".*/\1/p')" != ""

      - name: Build with Gradle
        run: ./gradlew clean build